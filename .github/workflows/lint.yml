name: lint
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      # A commit, not a tag: this repository of all repositories should not build
      # from a pointer upstream can move. v4.4.0.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: bash syntax check (bash -n)
        run: |
          set -e
          for f in $(git ls-files '*.sh') bin/*; do
            bash -n "$f"
            echo "syntax OK: $f"
          done

      - name: shellcheck (warning severity)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q shellcheck
          shellcheck -S warning $(git ls-files '*.sh') bin/*

  pin-fixtures:
    # The supply-chain gate against synthetic .SRCINFO fixtures and real local
    # git repositories. No root, no disk, no network — pure logic, so it runs
    # anywhere and on both architectures.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      # A commit, not a tag: this repository of all repositories should not build
      # from a pointer upstream can move. v4.4.0.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: pin/allowlist fixture test
        run: bash tests/pin-fixture-test.sh

  loopback:
    # Real pacman transactions against a throwaway package root on a
    # file-backed loop device. No real disk and no real package database is
    # touched. Runs in an Arch container because that is where a genuine
    # pacman, repo-add and makepkg toolchain exists; --privileged is required
    # for losetup inside the container.
    #
    # Arch is not Manjaro. What only Manjaro can vouch for — its pacman.conf,
    # pacman-mirrors, manjaro-chrootbuild, and the live AUR — is covered by
    # tests/manjaro-integration-test.sh, which is NOT run here: there is no
    # maintained Manjaro image to run it in (manjarolinux/base was last built
    # in March 2026). It is run on a real Manjaro install before a release.
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: install test dependencies
        run: |
          pacman -Sy --noconfirm --needed \
            git gcc e2fsprogs util-linux libarchive pacman-contrib
      # A commit, not a tag: this repository of all repositories should not build
      # from a pointer upstream can move. v4.4.0.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: loopback core test
        run: bash tests/loopback-core-test.sh
